# wrangler writes its own debug log, at debug level, without a size limit: it
# reached 213MB in three weeks of uptime. Nothing reads it until something
# breaks, and by then it is too large to search.
#
#   install -m 644 deploy/chanlyst-logrotate.conf /etc/logrotate.d/chanlyst
#
# copytruncate rather than a restart: the file is held open by a long-running
# process, and restarting the service to rotate a log would cause exactly the
# outage this is meant to help diagnose.
/var/lib/chanlyst/wrangler.log {
    daily
    rotate 5
    size 50M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    su chanlyst chanlyst
}
