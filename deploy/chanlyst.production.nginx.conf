limit_req_zone $binary_remote_addr zone=chanlyst_auth:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chanlyst.com www.chanlyst.com;

    ssl_certificate /etc/letsencrypt/live/chanlyst.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chanlyst.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    proxy_redirect http://chanlyst.com/ https://chanlyst.com/;
    proxy_redirect http://www.chanlyst.com/ https://www.chanlyst.com/;

    location = /api/contact {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location = /api/auth/password {
        limit_req zone=chanlyst_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # Discovery is the one request that legitimately runs for minutes: four
    # search lanes, each waiting on a model. On 13 August a run reached 216
    # seconds, this proxy cut it at 180, and because the route returns its
    # results for the browser to save, the whole run was discarded after it had
    # already been paid for. An exact-match location keeps the longer patience
    # to that one endpoint instead of every API call.
    #
    # This is a margin, not a fix. The work belongs in pipeline_runs, where the
    # server saves the result and no browser has to stay attached.
    location = /api/discover {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location ^~ /dashboard {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chanlyst.com www.chanlyst.com;
    return 301 https://$host$request_uri;
}
